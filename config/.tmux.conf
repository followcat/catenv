# ============================================
# CatEnv Tmux Configuration
# 优化用于长时间运行任务和 GitHub Copilot CLI
# ============================================

# ============================================
# 基础设置
# ============================================

# 使用 C-a 作为前缀键（类似 screen）
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 启用鼠标支持
set -g mouse on

# 设置终端颜色
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 设置起始索引为 1（而不是 0）
set -g base-index 1
setw -g pane-base-index 1

# 重新编号窗口
set -g renumber-windows on

# 启用活动监视
setw -g monitor-activity on
set -g visual-activity off

# 设置更长的显示时间
set -g display-panes-time 2000
set -g display-time 2000

# ============================================
# 历史记录设置 - 超大缓冲区
# ============================================

# 设置超大的历史记录缓冲区（100万行）
set -g history-limit 1000000

# 保存缓冲区历史到文件的快捷键
bind-key S command-prompt -p 'save history to filename:' -I '~/tmux-history.txt' 'capture-pane -S -1000000 ; save-buffer %1 ; delete-buffer'

# ============================================
# 会话持久化和恢复
# ============================================

# 退出后保持会话
set -g detach-on-destroy off

# 启用自动重命名
setw -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#T - #W"

# ============================================
# 按键绑定
# ============================================

# 重新加载配置文件
bind r source-file ~/.tmux.conf \; display "Tmux 配置已重新加载！"

# 分割窗口（更直观的快捷键）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新窗口使用当前路径
bind c new-window -c "#{pane_current_path}"

# 窗格导航（类似 Vim）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 窗格调整大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 快速切换窗格
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# 同步所有窗格（用于同时操作多个窗格）
bind S setw synchronize-panes

# 进入复制模式
bind Escape copy-mode

# ============================================
# 复制模式设置（Vi 风格）
# ============================================

# 使用 vi 模式
setw -g mode-keys vi

# Vi 风格的复制和粘贴
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 复制到系统剪贴板（需要 xclip 或 xsel）
if-shell "command -v xclip" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

if-shell "command -v xsel" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xsel --clipboard --input'"

# macOS 剪贴板支持
if-shell "command -v pbcopy" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'"

# 鼠标拖拽复制
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ============================================
# 状态栏设置
# ============================================

# 启用状态栏
set -g status on

# 状态栏位置
set -g status-position bottom

# 状态栏刷新间隔（秒）
set -g status-interval 1

# 状态栏颜色
set -g status-style bg=colour234,fg=colour137

# 左侧状态栏
set -g status-left-length 50
set -g status-left "#[fg=colour232,bg=colour154,bold] #S #[fg=colour154,bg=colour238,nobold]#[fg=colour250,bg=colour238] #I:#P #[fg=colour238,bg=colour234,nobold]"

# 右侧状态栏（显示时间、日期、主机名等）
set -g status-right-length 100
set -g status-right "#[fg=colour238,bg=colour234]#[fg=colour250,bg=colour238] %Y-%m-%d #[fg=colour245]#[fg=colour250]%H:%M:%S #[fg=colour154,bg=colour238]#[fg=colour232,bg=colour154,bold] #H "

# 窗口状态格式
setw -g window-status-format "#[fg=colour244,bg=colour234] #I #[fg=colour250,bg=colour234]#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour31]#[fg=colour231,bg=colour31,bold] #I #[fg=colour231,bold]#W #[fg=colour31,bg=colour234,nobold]"

# 窗口分隔符
setw -g window-status-separator ""

# ============================================
# 面板边框
# ============================================

# 面板边框颜色
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour154

# 面板编号显示
set -g display-panes-active-colour colour154
set -g display-panes-colour colour238

# ============================================
# 消息样式
# ============================================

set -g message-style bg=colour154,fg=colour232,bold
set -g message-command-style bg=colour233,fg=colour250

# ============================================
# 性能优化
# ============================================

# 减少延迟
set -s escape-time 0

# 增加重复时间
set -g repeat-time 600

# 聚焦事件
set -g focus-events on

# ============================================
# 长时间任务优化
# ============================================

# 会话空闲超时（0 表示永不超时）
set -g lock-after-time 0

# 保持窗口活动
setw -g remain-on-exit off

# 自动保存间隔
set -g status-interval 15

# ============================================
# 快捷键助手
# ============================================

# 显示所有按键绑定
bind ? list-keys

# 显示所有会话
bind w choose-tree -Zs

# ============================================
# 插件支持（可选）
# ============================================

# Tmux Plugin Manager (TPM) 路径
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# 自动恢复上次会话
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '15'

# 初始化 TPM（保持在文件最底部）
# run '~/.tmux/plugins/tpm/tpm'

# ============================================
# 自定义命令
# ============================================

# 快速启动 GitHub Copilot CLI 会话
bind C new-window -n "copilot" "zsh"

# 创建日志窗口
bind L new-window -n "logs" "tail -f /var/log/syslog"

# 创建监控窗口
bind M new-window -n "monitor" "htop"
